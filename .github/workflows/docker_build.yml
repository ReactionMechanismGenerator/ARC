name: Docker Image Build and Push

on:
  schedule:
    - cron: "0 0 */7 * *" # every 7 days
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "dockerfiles/**"
      - ".github/workflows/docker_build.yml"
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: # manual trigger: builds and smoke-tests, never pushes

env:
  BUILDKIT_PROGRESS: plain

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.1.0
      
      # ----- PR / manual-dispatch steps -----
      # Build the image and run smoke tests, but do not push
      - name: Build Docker Image (No Push)
        if: ${{ !(github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: arc:test
          build-args: |
            ARC_BRANCH=${{ github.head_ref || github.ref_name }}
            ARC_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Tests
        if: ${{ !(github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        run: |
          docker run --rm arc:test bash -lc \
            "cd /home/mambauser/Code/ARC && micromamba run -n arc_env pytest dockerfiles/docker_tests/test_docker_smoke.py -m smoke -q"

      # ----- Publishing steps (pushes to main, and the weekly schedule) -----
      # Scheduled runs are on the default branch, so they are treated exactly like a push to main:
      # build, run smoke tests, and push to Docker Hub. Previously no step matched a `schedule`
      # event at all, so scheduled runs built nothing and still reported success.
      - name: Build image (publish path)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: arc:final-${{ github.sha }}
          build-args: |
            ARC_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Smoke Tests (publish path)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: |
          docker run --rm arc:final-${{ github.sha }} bash -lc \
            "cd /home/mambauser/Code/ARC && micromamba run -n arc_env pytest dockerfiles/docker_tests/test_docker_smoke.py -m smoke -q"

      - name: Login to Docker Hub
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build final and push
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/arc:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/arc:${{ github.sha }}
          build-args: |
            ARC_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
