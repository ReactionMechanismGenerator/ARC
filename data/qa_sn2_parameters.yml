# Configuration file for QA-SN2 reaction parameters

family_parameters:
  qa_sn2:
    r_value: [2.07, 0.959, 1.61, 1.006, 0.958]
    a_value: [166.0, 102.3, 107.6, 174.3, 104.1]
    d_values:
      #  R1-N-Ca-Or  N-Ca-Or-Hr  Ca-Hr-Or-H1w  Hr-Or-H1w-Ow  Or-H1w-Ow-H2w
      - [-163.56,  scan,   97.3,  -114.4,   69.6]
      - [-163.56,  scan,   97.3,  -114.4,  -69.6]
      - [-163.56,  scan,  -97.3,   114.4,   69.6]
      - [-163.56,  scan,  -97.3,   114.4,  -69.6]

    # N-Ca-Or-Hr scan values: centres of the dihedral clusters in 13 QM-optimised QA SN2 TS
    # structures (wB97X-D/cc-pVTZ, SMD), plus two gap-filling values (41, 99).
    hr_dihedral_scan_values: [-175.0, -128.0, -86.0, -18.0, 41.0, 99.0, 158.0]

    # Multiplicative factor applied to the breaking C-N bond length
    stretch: 1.3

units:
  distances: Angstroms
  angles: degrees
  stretching_factors: dimensionless
