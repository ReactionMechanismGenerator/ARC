# A legacy (pre-PR #1090) ARC restart file for the doublet reaction R <=> P ([CH2]C(C)CC <=> CC(C)[CH]C).
# Generated at official/main d3d7c5524 (the parent of #1090), by running, with JobAdapter.execute stubbed:
#   ARC(project='legacy_doublet_restart', species=[R, P], reactions=[{'label': 'R <=> P', 'reactants': ['R'],
#       'products': ['P']}], ess_settings={'gaussian': ['server2', 'server3']}, ...)
#   then Scheduler(..., testing=True, restart_dict=arc.restart_dict), which created TS0 at the pinned multiplicity.
# ARC.__init__ wrote the reaction multiplicity before the species were attached, so it was pinned to 1 (issue #1048)
# and TS0 inherited it. To mimic a run in progress, R and P were marked converged (final_xyz set), TS0 got a geometry
# (final_xyz, an opt 'geo' path) and two running TS0 jobs: freq on server2 (Slurm, job id 12345) and sp on server3
# (PBS, job id 67890). Then Scheduler.save_restart_dict() wrote this file.
# PROJECT_DIRECTORY replaces the original project path; tests substitute their own directory.
